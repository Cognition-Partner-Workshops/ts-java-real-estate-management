name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; superseded runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NG_CLI_ANALYTICS: 'false'

jobs:
  validate:
    name: Validate (typecheck + lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend-fastify/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Backend lockfile is in sync
        working-directory: backend-fastify
        run: npm ci

      - name: Backend syntax check
        working-directory: backend-fastify
        # No formatter is configured in this repo; this is the equivalent
        # "does every module parse" gate for the plain-JS backend.
        run: find src scripts test -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `soft_fail` keeps the pipeline green for checks that are broken in the
    # baseline repository (see docs/CICD.md); flip it off once fixed.
    continue-on-error: ${{ matrix.soft_fail == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: lint
            command: npm run lint
          - task: test
            command: npm run test:ci
            soft_fail: true
          - task: build
            command: npm run build:prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ${{ matrix.task }}
        working-directory: frontend
        run: ${{ matrix.command }}

      - name: Upload coverage report
        if: ${{ matrix.task == 'test' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload production bundle
        if: ${{ matrix.task == 'build' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/www/
          retention-days: 7

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECT: mongodb://127.0.0.1:27017/rem-db-test
      SECRET_KEY: ci-secret
      SALT: '4'
      LOGGER: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend-fastify/package-lock.json

      - name: Install dependencies
        working-directory: backend-fastify
        run: npm ci

      - name: Lint
        working-directory: backend-fastify
        run: npm run lint

      - name: Unit + integration tests (against MongoDB service container)
        working-directory: backend-fastify
        run: |
          mkdir -p reports
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=reports/junit.xml \
            "test/**/*.test.js"

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-report
          path: backend-fastify/reports/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: frontend
          - component: backend
            context: backend-fastify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build only (never pushed from CI); deployment lives in cd.yml.
      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          tags: rem-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
